<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code · Agent Chat (build 3)</title>
<style>
:root {
  --chat-bg: #FAFAF8; --side-bg: #FFFFFF; --head-bg: #F0F2F5; --ink: #1F2328; --muted: #667781; --line: #E2E5E8;
  --user-bg: #EAF2FB; --user-bd: #5B8DEF;
  --asst-bg: #EAF7EE; --asst-bd: #4CAF7A;
  --call-bg: #FFF4E5; --call-bd: #F0A35E;
  --res-bg: #EEF6F7;  --res-bd: #5FA8B0;
  --err-bg: #FDECEC;  --err-bd: #E06C6C;
  --think-bg: #F3EEFA; --think-bd: #9B7FD1;
  --badge: #25A366; --changed: #E8A317;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; color: var(--ink); background: #DDE1E4;
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
code, pre, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; font-size: 12.5px; }
button, select { font: inherit; font-size: 13px; padding: 3px 10px; border-radius: 6px;
  border: 1px solid #CDD2D6; background: #fff; cursor: pointer; color: var(--ink); }
button:hover { background: #F4F5F6; }

#app { display: grid; grid-template-columns: 320px 1fr; grid-template-rows: 100vh; height: 100vh; }
#app.info-open { grid-template-columns: 320px 1fr 360px; }

/* ---------- chat list (left) */
#list { background: var(--side-bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
#listHead { background: var(--head-bg); padding: 12px 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
#listHead h1 { font-size: 16px; margin: 0; font-weight: 650; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #bbb; display: inline-block; }
.dot.on { background: var(--badge); }
#listHead .sp { flex: 1; }
#rows { overflow-y: auto; flex: 1; min-height: 0; }
.row { display: flex; gap: 10px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #F0F2F5; align-items: center; }
.row:hover { background: #F5F6F6; }
.row.active { background: #EBEDEF; }
.avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 21px; flex: none; background: #E7EBEE; }
.row .mid { flex: 1; min-width: 0; }
.row .top, .row .bot { display: flex; gap: 6px; align-items: baseline; }
.row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.row .time { font-size: 11.5px; color: var(--muted); flex: none; }
.row.unread .time { color: var(--badge); font-weight: 600; }
.row .prev { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.row .badge { background: var(--badge); color: #fff; border-radius: 10px; font-size: 11.5px; font-weight: 700; padding: 0 7px; flex: none; }
.row .warn { flex: none; font-size: 13px; }
.tag { font-size: 11px; padding: 0 7px; border-radius: 9px; background: #EEF0F2; color: #555; white-space: nowrap; }
.tag.model { background: #EEF0F8; color: #3B4A7A; }
.tag.sub { background: #EAF7EE; color: #23663D; }

/* ---------- conversation (center) */
#conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--chat-bg); position: relative; }
#chead { background: var(--head-bg); padding: 8px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); min-height: 60px; }
#chead .who { flex: 1; min-width: 0; cursor: pointer; }
#chead .title { font-weight: 650; font-size: 15px; display: flex; gap: 8px; align-items: center; }
#chead .members, #cMembers { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#errBtn { display: none; }
#errBtn.has { display: inline-block; background: var(--err-bg); border-color: var(--err-bd); color: #9b2c2c; font-weight: 600; }
#scroller { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 6% 10px; }
.chatroot { display: flex; flex-direction: column; gap: 14px; }
.empty { color: var(--muted); text-align: center; padding: 50px 0; font-size: 13.5px; }
#typing { padding: 4px 6% 10px; min-height: 26px; font-size: 13px; color: var(--muted); font-style: italic; background: var(--chat-bg); }
#typing span { margin-right: 14px; }
#typing span::after { content: ""; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
#newBtn { position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); display: none;
  background: #fff; border: 1px solid #CDD2D6; border-radius: 18px; padding: 6px 16px; font-weight: 600;
  box-shadow: 0 2px 8px rgba(0,0,0,.15); color: #1A7F4B; }

/* messages */
.msg { display: flex; flex-direction: column; max-width: 78%; }
.msg.left { align-self: flex-start; }
.msg.right { align-self: flex-end; align-items: flex-end; }
.sender { font-weight: 700; font-size: 13px; margin: 0 0 3px 4px; }
.bubble { border-radius: 12px; border: 1px solid; padding: 8px 12px; min-width: 120px; max-width: 100%;
  box-shadow: 0 1px 1px rgba(0,0,0,.04); overflow-wrap: anywhere; }
.msg.left .bubble { border-top-left-radius: 3px; }
.msg.right .bubble { border-top-right-radius: 3px; }
.b-user { background: var(--user-bg); border-color: var(--user-bd); }
.b-asst { background: var(--asst-bg); border-color: var(--asst-bd); }
.b-res  { background: var(--res-bg); border-color: var(--res-bd); }
.b-err  { background: var(--err-bg); border-color: var(--err-bd); }
.txt { white-space: pre-wrap; }
.txt + .txt, .blk + .blk, .txt + .blk, .blk + .txt { margin-top: 8px; }
.call { background: var(--call-bg); border: 1px solid var(--call-bd); border-radius: 8px; padding: 6px 9px; }
.call .cname { font-weight: 700; }
.call pre { margin: 4px 0 0; white-space: pre-wrap; }
details.think { background: var(--think-bg); border: 1px solid var(--think-bd); border-radius: 8px; padding: 4px 9px; }
details.think > summary, details.rem > summary, details.dd > summary { cursor: pointer; }
details.think .txt { margin-top: 4px; color: #4A3D66; }
details.rem { opacity: .55; font-size: 12px; margin-top: 4px; }
details.rem pre { white-space: pre-wrap; margin: 2px 0 0; font-size: 11.5px; }
.quote { background: rgba(255,255,255,.65); border-left: 4px solid var(--call-bd); border-radius: 6px;
  padding: 3px 8px; margin-bottom: 6px; font-size: 12.5px; cursor: pointer; }
.quote .qn { font-weight: 700; }
.quote .qs { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.errhead { color: #9b2c2c; font-weight: 700; margin-bottom: 4px; }
.meta { display: flex; justify-content: flex-end; align-items: center; gap: 6px; font-size: 11px; color: #8B9096; margin-top: 4px; }
.info { border: none; background: none; padding: 0 3px; font-size: 13px; color: #8B9096; cursor: pointer; }
.info:hover { color: var(--ink); background: none; }
.imgph { display: inline-block; border: 1px dashed #AAB; border-radius: 6px; padding: 4px 10px; color: var(--muted); font-size: 12.5px; }
.sysline { align-self: center; background: #ECEFF1; color: #5F6B73; border-radius: 9px; padding: 3px 12px; font-size: 12px;
  box-shadow: 0 1px 1px rgba(0,0,0,.04); max-width: 80%; text-align: center; }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px rgba(91,141,239,.45); } to { box-shadow: 0 0 0 0 rgba(91,141,239,0); } }
.hidden { display: none !important; }

/* clamp for long text */
.clamp { max-height: 19em; overflow: hidden; position: relative; }
.clamp::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.5em;
  background: linear-gradient(rgba(255,255,255,0), rgba(255,255,255,.85)); }
.more { margin-top: 4px; font-size: 12px; padding: 1px 8px; }

/* JSON */
pre.json { white-space: pre-wrap; margin: 0; }
.j-k { color: #8A4B08; } .j-s { color: #1A7F37; } .j-n { color: #0550AE; } .j-b { color: #8250DF; } .j-z { color: #8B9096; }

/* side requests: compact + dimmed */
.sidereq { align-self: stretch; max-width: 100%; opacity: .65; background: #fff; border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 10px; font-size: 12.5px; }
.sidereq:hover { opacity: 1; }
.sidereq.err { border-color: var(--err-bd); background: var(--err-bg); opacity: .9; }
.sidereq .sl { display: flex; gap: 8px; align-items: baseline; white-space: nowrap; }
.sidereq .sp { flex: 1; }
.sidereq .q, .sidereq .a { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidereq .a { color: var(--ink); }

/* ---------- group info (right) */
#infoPanel { background: #fff; border-left: 1px solid var(--line); overflow-y: auto; display: none; }
#app.info-open #infoPanel { display: block; }
#infoHead { background: var(--head-bg); padding: 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; }
#infoHead b { flex: 1; }
.isec { padding: 12px 14px; border-bottom: 8px solid #F0F2F5; }
.isec h3 { margin: 0 0 6px; font-size: 13px; color: #1A7F4B; font-weight: 650; }
.changed { font-size: 10.5px; background: var(--changed); color: #fff; border-radius: 8px; padding: 0 6px; margin-left: 6px; font-weight: 700; vertical-align: 1px; }
details.dd > summary { color: var(--muted); font-size: 13px; }
details.dd pre { white-space: pre-wrap; font-size: 12px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--muted); }

/* ---------- request details modal */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 50; }
#modal.open { display: flex; }
#modalBox { background: #fff; width: min(900px, 92vw); max-height: 86vh; overflow-y: auto; border-radius: 10px; padding: 14px 18px; }
#modalBox h2 { font-size: 16px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
#modalBox h2 .sp { flex: 1; }
#modalBox details { margin: 6px 0; }
#modalBox summary { cursor: pointer; font-weight: 600; }

/* ---------- build 3: WhatsApp touches (section 12) */
#chead .status { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#chead .status b { font-weight: 600; }
#chead .status .typing { color: #1A7F4B; font-weight: 600; }
.ctx { font-size: 12px; padding: 1px 8px; border-radius: 9px; background: #EEF0F2; color: #5F6B73; white-space: nowrap; flex: none; }
.ctx.warn { background: #FFF1DD; color: #B25E00; } .ctx.crit { background: var(--err-bg); color: #B02A2A; font-weight: 700; }
.ticks { font-size: 12px; letter-spacing: -2px; color: #8B9096; cursor: default; margin-left: 2px; }
.ticks.blue { color: #34B7F1; } .ticks.err { color: #D33; letter-spacing: 0; }
#pin { display: none; background: #fff; border-bottom: 1px solid var(--line); padding: 6px 14px; font-size: 13px; cursor: pointer; }
#pin.on { display: block; }
#pin .pl { display: flex; gap: 8px; align-items: center; }
#pin .pl .sp { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#pin ul { list-style: none; margin: 6px 0 2px; padding: 0 0 0 4px; }
#pin li { padding: 1px 0; } #pin li.done { color: var(--muted); text-decoration: line-through; } #pin li.now { font-weight: 600; }
.doc { display: flex; gap: 10px; background: rgba(255,255,255,.75); border: 1px solid #D5DADF; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.doc:hover { background: #fff; }
.doc .ic { font-size: 26px; line-height: 1; }
.doc .dn { font-weight: 650; } .doc .dm { font-size: 12px; color: var(--muted); }
.doc pre { margin: 4px 0 0; font-size: 11.5px; color: #4B5560; white-space: pre; overflow: hidden; text-overflow: ellipsis; max-width: 520px; }
.newfile { font-size: 10.5px; background: #E6F4EA; color: #1E6B35; border-radius: 8px; padding: 0 6px; margin-left: 6px; font-weight: 700; }
.diff { border: 1px solid #DDE1E4; border-radius: 6px; overflow: hidden; background: #fff; margin-top: 4px; }
.diff .dh { font-size: 12px; color: var(--muted); padding: 2px 8px; background: #F6F7F8; border-bottom: 1px solid #E6E8EA; }
.diff .dl { white-space: pre-wrap; padding: 0 8px 0 4px; font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; font-size: 12px; }
.diff .dl.del { background: #FCE8E8; } .diff .dl.add { background: #E6F4EA; }
.diff .dl .mk { display: inline-block; width: 14px; color: #8B9096; user-select: none; }
.cmd { font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; font-size: 12.5px; background: #2B2F36; color: #E6E6E6; border-radius: 6px; padding: 4px 8px; margin-top: 4px; white-space: pre-wrap; }
.cmd .pr { color: #7EE787; user-select: none; }
.cdesc { font-size: 12px; color: var(--muted); margin-top: 3px; }
.b-term { background: #2B2F36; border-color: #5FA8B0; color: #E6E6E6; }
.b-term.b-termerr { border-color: var(--err-bd); }
.b-term .txt { font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; font-size: 12.5px; }
.b-term .quote { background: rgba(255,255,255,.08); }
.b-term .quote .qs, .b-term .meta { color: #9AA3AD; }
.b-term .clamp::after { background: linear-gradient(rgba(43,47,54,0), rgba(43,47,54,.95)); }
.b-term .more { background: #3A3F47; color: #E6E6E6; border-color: #555; }
.b-term .errhead { color: #FF9C9C; }
.exit { font-size: 11px; border-radius: 8px; padding: 0 7px; font-weight: 700; margin-left: 6px; }
.exit.ok { background: #1E5B34; color: #B8F5C9; } .exit.bad { background: #7A2626; color: #FFD3D3; }
.turn { align-self: center; background: #E1F0F7; color: #3E5C6B; border-radius: 9px; padding: 3px 14px; font-size: 12px; font-weight: 600; box-shadow: 0 1px 1px rgba(0,0,0,.05); }
.msg.dim { opacity: .4; }
.msg.from-main .bubble { background: #F1F3F5; border-color: #9AA4AE; }
pre.num { white-space: pre; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <aside id="list">
    <div id="listHead"><span class="dot" id="conn" title="connection"></span><h1>Chats</h1><span class="sp"></span>
      <button id="clearBtn" title="Empty all chats">Clear</button></div>
    <div id="rows"></div>
  </aside>

  <section id="conv">
    <div id="chead">
      <div class="avatar" id="cAvatar">🤖</div>
      <div class="who" id="cWho" title="Group info">
        <div class="title"><span id="cName">Claude Code</span><span class="tag model" id="cModel"></span></div>
        <div class="status"><span id="cStatus">idle</span> · <span id="cMembers">You, Claude</span></div>
      </div>
      <span class="ctx" id="cCtx" title="Context window used by the last reply">🔋 ?</span>
      <button id="errBtn" title="Jump to the next error"></button>
      <select id="filter" title="Tool filter"><option value="">All</option></select>
    </div>
    <div id="pin" title="Pinned plan (TodoWrite)"></div>
    <div id="scroller"></div>
    <div id="typing"></div>
    <button id="newBtn"></button>
  </section>

  <aside id="infoPanel">
    <div id="infoHead"><b>Group info</b><button id="infoClose">✕</button></div>
    <div id="infoBody"></div>
  </aside>
</div>

<div id="modal"><div id="modalBox"></div></div>

<script>
"use strict";
// ------------------------------------------------------------------ helpers
const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function clock(ms) { const d = ms ? new Date(ms) : new Date(); return d.toTimeString().slice(0, 8); }
function fmtN(n) { n = n || 0; return n >= 10000 ? (n / 1000).toFixed(1) + "k" : n.toLocaleString("en-US"); }
function fmtMs(ms) { return ms == null ? "–" : ms < 1000 ? ms + " ms" : (ms / 1000).toFixed(1) + " s"; }
function fmtCost(c) { return c == null ? "n/a" : "$" + c.toFixed(c < 0.01 ? 4 : 3); }
function lines(s) { return s ? String(s).split("\n").length : 0; }
function oneLine(s, n) { s = String(s || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
const REM_RE = /(<system-reminder>[\s\S]*?<\/system-reminder>)/;
function stripReminders(s) { return String(s || "").split(REM_RE).filter(p => !REM_RE.test(p)).join("").trim(); }
const NAME_COLORS = ["#C2185B", "#7B1FA2", "#1565C0", "#00838F", "#2E7D32", "#EF6C00", "#6D4C41", "#AD1457", "#283593", "#00695C", "#9E6A03", "#5E35B1"];
function toolColor(name) { let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return NAME_COLORS[h % NAME_COLORS.length]; }

function highlightJSON(obj) {
  const s = esc(JSON.stringify(obj, null, 2) ?? "null");
  return s.replace(/(&quot;(?:\\.|[^\\&]|&(?!quot;))*?&quot;)(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g,
    (m, str, colon, bool) => {
      if (str) return colon ? `<span class="j-k">${str}</span>${colon}` : `<span class="j-s">${str}</span>`;
      if (bool) return `<span class="j-b">${m}</span>`;
      if (m === "null") return `<span class="j-z">${m}</span>`;
      return `<span class="j-n">${m}</span>`;
    });
}
// Long text: clamp at ~14 lines / 1800 chars with a "Show all" button.
function clampable(node, text) {
  const n = lines(text);
  if (n <= 14 && String(text).length <= 1800) return node;
  const wrap = el("div", "blk");
  node.classList.add("clamp");
  const b = el("button", "more", `Show all (${n} lines)`);
  b.onclick = () => { const c = node.classList.toggle("clamp"); b.textContent = c ? `Show all (${n} lines)` : "Show less"; };
  wrap.append(node, b);
  return wrap;
}
function textNode(text) { return clampable(el("div", "txt", text), text); }
function jsonNode(obj) {
  const pre = el("pre", "json");
  pre.innerHTML = highlightJSON(obj);
  return clampable(pre, JSON.stringify(obj, null, 2) || "");
}
function flash(node) { node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash"); }

// Key used to compare messages between requests: ignores cache_control and
// thinking blocks (which clients may drop), compares tool calls by id.
function blockKey(b) {
  if (typeof b === "string") return "t:" + b.trim();
  if (!b || typeof b !== "object") return "?";
  switch (b.type) {
    case "text": return "t:" + (b.text || "").trim();
    case "tool_use": case "server_tool_use": return "u:" + b.id;
    case "tool_result": return "r:" + b.tool_use_id;
    case "thinking": case "redacted_thinking": return null;
    case "image": return "i";
    default: return b.type + ":" + (b.id || b.tool_use_id || "");
  }
}
function blocksOf(m) { return typeof m.content === "string" ? [{ type: "text", text: m.content }] : (Array.isArray(m.content) ? m.content : []); }
function msgKey(m) { return (m && m.role) + "|" + JSON.stringify(blocksOf(m || {}).map(blockKey).filter(k => k !== null)); }
function stripCache(v) {
  if (Array.isArray(v)) return v.map(stripCache);
  if (v && typeof v === "object") { const o = {}; for (const k in v) if (k !== "cache_control") o[k] = stripCache(v[k]); return o; }
  return v;
}
function systemText(sys) {
  if (!sys) return "";
  if (typeof sys === "string") return sys;
  if (Array.isArray(sys)) return sys.map(b => (b && b.text) || (typeof b === "string" ? b : JSON.stringify(b))).join("\n\n");
  return JSON.stringify(sys, null, 2);
}
function summarizeInput(input) {
  if (!input || typeof input !== "object") return oneLine(input, 90);
  for (const k of ["file_path", "command", "pattern", "path", "url", "query", "description", "prompt", "skill", "notebook_path"])
    if (typeof input[k] === "string" && input[k]) return oneLine(input[k], 90);
  return oneLine(JSON.stringify(input), 90);
}
function isSide(d) {
  const p = String(d.path || "").split("?")[0];
  return !(d.method === "POST" && /\/v1\/messages\/?$/.test(p) && Array.isArray(d.tools) && d.tools.length > 0);
}

// ------------------------------------------------------------------ state
let chats, current, calls, reqs, nextChatId, agentPrompts;
let rendering = null;   // the request whose messages are being drawn (its nodes are tracked, for forks)
function newChat(kind, name) {
  const c = {
    id: nextChatId++, kind, name, firstKey: null,
    root: el("div", "chatroot"), history: [], replyKeys: new Set(),
    system: null, sysKey: null, tools: null, toolsKey: null, sysChanged: false, toolsChanged: false,
    model: "", pending: 0, inGroup: new Map(), toolsSeen: new Set(), toolCounts: {},
    totals: { in: 0, out: 0, cr: 0, cc: 0, cost: 0, costUnknown: false, replies: 0 },
    errors: [], errIdx: 0, unread: 0, preview: "", time: "", newCount: 0, scrollTop: null, filter: "",
    lastAct: 0, lastEvt: 0, lastFinal: false, uncertain: false, firstText: "",
    plan: null, planOpen: false, turnNo: 0, turn: null, ctx: null,
  };
  c.root.dataset.chat = c.id;
  const empty = el("div", "empty", kind === "side" ? "No side requests yet." :
    kind === "main" ? "Waiting for traffic… run the agent with ANTHROPIC_BASE_URL pointing at this dashboard." : "");
  c.root.append(empty);
  c.emptyEl = empty;
  c.root.classList.add("hidden");
  $("scroller").append(c.root);
  chats.push(c);
  return c;
}
function reset() {
  $("scroller").innerHTML = "";
  chats = []; calls = new Map(); reqs = new Map(); nextChatId = 1; agentPrompts = new Set();
  newChat("main", "Claude Code");
  newChat("side", "Side requests");
  current = null;
  openChat(chats[0]);
}
const mainChat = () => chats.find(c => c.kind === "main");
const sideChat = () => chats.find(c => c.kind === "side");

// ------------------------------------------------------------------ adding items
function atBottom() { const s = $("scroller"); return s.scrollHeight - s.scrollTop - s.clientHeight < 60; }
function scrollBottom() { const s = $("scroller"); s.scrollTop = s.scrollHeight; }
function addItem(chat, node, opts) {
  opts = opts || {};
  if (chat.emptyEl) { chat.emptyEl.remove(); chat.emptyEl = null; }
  node.dataset.tools = opts.always ? " * " : " " + (opts.tools || []).join(" ") + " ";
  if (opts.user) node.dataset.user = "1";
  filterOne(chat, node);
  if (rendering) rendering.nodes.push(node);
  const isCur = chat === current;
  const wasBottom = isCur && atBottom();
  chat.root.append(node);
  if (opts.preview != null) { chat.preview = opts.preview; chat.time = clock(); }
  if (opts.count) {
    chat.lastAct = Date.now();
    if (!isCur) chat.unread++;
    else if (!wasBottom) chat.newCount++;
  }
  if (isCur) { if (wasBottom) scrollBottom(); updateNewBtn(); }
  scheduleList();
  return node;
}
function addSys(chat, text, tools) { return addItem(chat, el("div", "sysline", text), { tools }); }
function msgShell(side, senderText, senderColor) {
  const m = el("div", "msg " + side);
  if (senderText) { const s = el("div", "sender", senderText); if (senderColor) s.style.color = senderColor; m.append(s); }
  return m;
}
function infoButton(reqId) {
  const b = el("button", "info", "ⓘ");
  b.title = "Show the full request behind this message";
  b.onclick = e => { e.stopPropagation(); showRequest(reqId); };
  return b;
}

// ------------------------------------------------------------------ rendering: user
function renderUser(chat, m, reqId, at, rec) {
  const rest = [];
  for (const b of blocksOf(m)) {
    if (b && b.type === "tool_result") renderToolResult(chat, b, at);
    else rest.push(b);
  }
  if (!rest.length) return;
  const fromMain = chat.kind === "sub";
  const msg = fromMain ? msgShell("left from-main", "🤖 Main agent", "#455A64") : msgShell("right", null);
  const bub = el("div", "bubble b-user");
  let plain = "";
  for (const b of rest) {
    if (typeof b === "string" || (b && b.type === "text")) {
      const t = typeof b === "string" ? b : (b.text || "");
      for (const part of t.split(REM_RE)) {
        if (!part) continue;
        if (REM_RE.test(part)) {
          const d = el("details", "rem");
          d.append(el("summary", null, "system-reminder (" + lines(part) + " lines)"));
          d.append(el("pre", null, part.replace(/<\/?system-reminder>/g, "").trim()));
          bub.append(d);
        } else if (part.trim()) { bub.append(textNode(part.trim())); plain += part.trim() + " "; }
      }
    } else if (b && b.type === "image") {
      bub.append(el("div", "imgph", "🖼 image" + (b.source && b.source.media_type ? " (" + b.source.media_type + ")" : "")));
      plain += "🖼 image ";
    } else bub.append(jsonNode(b));
  }
  const meta = el("div", "meta", clock(at));
  if (rec) { const tk = el("span", "ticks"); rec.ticks.push(tk); meta.append(tk); updateTicks(rec); }
  bub.append(meta);
  if (!plain.trim()) bub.style.opacity = ".6";
  msg.append(bub);
  if (plain.trim() && rec) startTurn(chat, rec, at);
  addItem(chat, msg, { count: true, user: true, preview: (fromMain ? "Main agent: " : "You: ") + oneLine(plain || "(system reminder)", 60) });
}

// ------------------------------------------------------------------ ticks (section 12)
function updateTicks(rec) {
  const d = rec.d, r = rec.reply;
  let txt = "✓", cls = "ticks";
  const tip = ["sent " + clock(d.started_at)];
  if (rec.ttfb != null) { txt = "✓✓"; tip.push("first byte " + clock(d.started_at + rec.ttfb) + " (" + fmtMs(rec.ttfb) + ")"); }
  if (r) {
    if (r.status >= 400 || r.error) { txt = "⚠️"; cls += " err"; tip.push("failed: HTTP " + r.status); }
    else { txt = "✓✓"; cls += " blue"; }
    tip.push("done " + clock(d.started_at + (r.total_ms || 0)) + " (" + fmtMs(r.total_ms) + ")");
  }
  for (const t of rec.ticks) { t.textContent = txt; t.className = cls; t.title = tip.join("\n"); }
}

// ------------------------------------------------------------------ turn dividers (section 12)
function startTurn(chat, rec, at) {
  rec.prevTurn = { no: chat.turnNo, turn: chat.turn };
  chat.turnNo++;
  const div = el("div", "turn", "Turn " + chat.turnNo);
  // "a divider before each of your prompts after the first one": turn 1's divider
  // stays hidden until the turn ends, then shows its summary above the first prompt.
  if (chat.turnNo === 1) div.dataset.wait = "1";
  chat.turn = { no: chat.turnNo, start: at, calls: 0, cost: 0, costUnknown: false, div, done: false };
  addItem(chat, div, { always: true });
}
function addToTurn(chat, rec, r, content) {
  const t = chat.turn;
  if (!t || t.done) return;
  const nCalls = content.filter(b => b && (b.type === "tool_use" || b.type === "server_tool_use")).length;
  t.calls += nCalls;
  if (r.cost != null) t.cost += r.cost; else if ((r.usage || {}).output_tokens) t.costUnknown = true;
  if (nCalls || r.status >= 400 || r.error) return;
  t.done = true;
  const secs = Math.max(0, (rec.d.started_at + (r.total_ms || 0)) - t.start) / 1000;
  t.div.textContent = `Turn ${t.no} · ${t.calls} tool call${t.calls === 1 ? "" : "s"} · ${secs < 10 ? secs.toFixed(1) : Math.round(secs)} s · ${t.costUnknown ? "n/a" : fmtCost(t.cost)}`;
  delete t.div.dataset.wait;
  filterOne(chat, t.div);
}

// ------------------------------------------------------------------ rendering: Claude
function renderClaude(chat, content, reqId, reply) {
  const msg = msgShell("left", "🤖 Claude", "#23663D");
  const bub = el("div", "bubble b-asst");
  const toolNames = [];
  const callIds = [];
  let preview = "";
  for (const b of content) {
    if (!b) continue;
    if (b.type === "text") { if ((b.text || "").trim()) { bub.append(textNode(b.text)); preview = preview || b.text; } }
    else if (b.type === "thinking" || b.type === "redacted_thinking") {
      const d = el("details", "think blk");
      const t = b.thinking || "";
      d.append(el("summary", null, t ? `💭 Thinking (${lines(t)} lines)` : "💭 Thinking (hidden by the API)"));
      if (t) d.append(textNode(t));
      bub.append(d);
    } else if (b.type === "tool_use" || b.type === "server_tool_use") {
      const box = el("div", "call blk");
      const h = el("div");
      h.innerHTML = `🔧 <span class="cname">${esc(b.name)}</span>`;
      h.querySelector(".cname").style.color = toolColor(b.name);
      box.append(h, callBody(chat, b));
      bub.append(box);
      if (rendering) rendering.callIds.push(b.id);
      toolNames.push(b.name);
      callIds.push(b.id);
      calls.set(b.id, { chat, name: b.name, input: b.input, node: box });
      chat.toolsSeen.add(b.name);
      chat.toolCounts[b.name] = (chat.toolCounts[b.name] || 0) + 1;
      preview = preview || ("🔧 " + b.name + " " + summarizeInput(b.input));
    } else if (b.type === "image") bub.append(el("div", "imgph blk", "🖼 image"));
    else bub.append(jsonNode(b));
  }
  if (!bub.childNodes.length) bub.append(el("div", "txt muted", "(empty reply)"));
  const meta = el("div", "meta");
  if (reply) {
    const u = reply.usage || {};
    meta.textContent = [clock(), "in " + fmtN(u.input_tokens), "cache read " + fmtN(u.cache_read_input_tokens),
      "cache write " + fmtN(u.cache_creation_input_tokens), "out " + fmtN(u.output_tokens),
      fmtMs(reply.ttfb_ms) + " / " + fmtMs(reply.total_ms), fmtCost(reply.cost)].join(" | ");
  } else meta.textContent = "from history";
  meta.append(infoButton(reqId));
  bub.append(meta);
  msg.append(bub);
  addItem(chat, msg, { count: true, tools: toolNames, preview: "Claude: " + oneLine(preview || "…", 60) });
  callIds.forEach((id, i) => {
    addSys(chat, `🔧 ${toolNames[i]} joined the group`, [toolNames[i]]);
    chat.inGroup.set(id, toolNames[i]);
  });
  refreshFilter(chat);
}
// The body of a tool call box inside Claude's bubble (section 12 for Bash, Edit, Write, TodoWrite).
function callBody(chat, b) {
  const inp = b.input || {};
  const w = el("div");
  if (b.name === "Bash" && typeof inp.command === "string") {
    const c = el("div", "cmd"); c.append(el("span", "pr", "$ "), document.createTextNode(inp.command));
    w.append(clampable(c, inp.command));
    if (inp.description) w.append(el("div", "cdesc", inp.description));
    return w;
  }
  if ((b.name === "Edit" || b.name === "MultiEdit") && inp.file_path) {
    const edits = b.name === "MultiEdit" ? (inp.edits || []) : [inp];
    let del = 0, add = 0;
    for (const e of edits) { del += lines(e.old_string); add += lines(e.new_string); }
    w.append(el("div", "mono", `✏️ ${inp.file_path}  ·  −${del} +${add} lines` + (edits.length > 1 ? `  ·  ${edits.length} edits` : "")));
    w.append(el("div", "cdesc", "the diff is in " + b.name + "'s answer below"));
    return w;
  }
  if (b.name === "Write" && inp.file_path) { w.append(docCard(inp.file_path, String(inp.content || ""), true)); return w; }
  if (b.name === "TodoWrite" && Array.isArray(inp.todos)) {
    chat.plan = inp.todos;
    if (chat === current) renderPin();
    const t = el("div", "txt", inp.todos.map(x => todoIcon(x.status) + " " + (x.content || "")).join("\n"));
    w.append(t);
    return w;
  }
  if ((b.name === "Agent" || b.name === "Task") && typeof inp.prompt === "string") notePrompt(inp.prompt);
  w.append(jsonNode(inp));
  return w;
}
function notePrompt(p) {
  const k = p.trim();
  agentPrompts.add(k);
  for (const c of chats) if (c.kind === "sub" && c.uncertain && c.firstText === k) { c.uncertain = false; scheduleList(); }
}
function todoIcon(st) { return st === "completed" ? "✅" : st === "in_progress" ? "⏳" : "☐"; }

// ------------------------------------------------------------------ files: document cards and diffs
function baseName(p) { return String(p || "").split(/[\\/]/).pop() || String(p || "file"); }
const NUM_RE = /^\s*\d+(?:→|\t)/;
function dropNumbers(t) { return String(t).split("\n").map(l => l.replace(NUM_RE, "")).join("\n"); }
function docCard(path, text, isNew) {
  const body = String(text).replace(/\n+$/, "");
  const n = body ? lines(body) : 0;
  const card = el("div", "doc blk");
  card.append(el("div", "ic", "📄"));
  const r = el("div"); r.style.minWidth = "0";
  const nm = el("div", "dn", baseName(path) + " · " + n + " line" + (n === 1 ? "" : "s"));
  if (isNew) nm.append(el("span", "newfile", "new file"));
  r.append(nm, el("div", "dm", path));
  const prev = dropNumbers(body).split("\n").slice(0, 3).join("\n");
  if (prev.trim()) r.append(el("pre", null, prev));
  card.append(r);
  card.title = "Open the full file";
  card.onclick = e => { e.stopPropagation(); openDoc(path, body); };
  return card;
}
function openDoc(path, text) {
  const box = $("modalBox");
  box.innerHTML = "";
  const h = el("h2");
  h.append(el("span", null, "📄 " + path), el("span", "sp"));
  const x = el("button", null, "✕"); x.onclick = closeModal; h.append(x);
  box.append(h);
  const ls = String(text).split("\n");
  const numbered = ls.length && NUM_RE.test(ls[0]);
  const w = String(ls.length).length;
  box.append(el("pre", "num", numbered ? text : ls.map((l, i) => String(i + 1).padStart(w, " ") + "  " + l).join("\n")));
  $("modal").classList.add("open");
}
function diffNode(path, oldS, newS) {
  const d = el("div", "diff blk");
  d.append(el("div", "dh", "✏️ " + path));
  const add = (cls, mk, t) => { const l = el("div", "dl " + cls); l.append(el("span", "mk", mk), document.createTextNode(t)); d.append(l); };
  if (oldS) for (const l of String(oldS).split("\n")) add("del", "−", l);
  if (newS) for (const l of String(newS).split("\n")) add("add", "+", l);
  return clampable(d, String(oldS || "") + "\n" + String(newS || ""));
}

function renderClaudeError(chat, reply, reqId) {
  const msg = msgShell("left", "🤖 Claude", "#23663D");
  const bub = el("div", "bubble b-err");
  const e = reply.error || {};
  bub.append(el("div", "errhead", `⚠️ HTTP ${reply.status}` + (e.type ? " · " + e.type : "")));
  bub.append(textNode(e.message || (typeof e === "string" ? e : JSON.stringify(e, null, 2))));
  const meta = el("div", "meta", clock() + " | " + fmtMs(reply.total_ms));
  meta.append(infoButton(reqId));
  bub.append(meta);
  msg.append(bub);
  addItem(chat, msg, { count: true, preview: "⚠️ HTTP " + reply.status });
  addError(chat, msg);
}
function addError(chat, node) { chat.errors.push(node); if (chat === current) updateHeader(); scheduleList(); }

// ------------------------------------------------------------------ rendering: tool result
function resultText(content) {
  if (typeof content === "string") return { text: content, images: 0, other: [] };
  const out = { text: "", images: 0, other: [] };
  for (const b of content || []) {
    if (b && b.type === "text") out.text += (out.text ? "\n" : "") + (b.text || "");
    else if (b && b.type === "image") out.images++;
    else out.other.push(b);
  }
  return out;
}
function renderToolResult(chat, b, at) {
  const call = calls.get(b.tool_use_id);
  const name = call ? call.name : "Tool";
  const color = call ? toolColor(name) : "#5F6B73";
  const msg = msgShell("left", "🔧 " + name, color);
  const err = b.is_error === true;
  const isBash = name === "Bash";
  const bub = el("div", "bubble " + (isBash ? "b-term" + (err ? " b-termerr" : "") : err ? "b-err" : "b-res"));
  const q = el("div", "quote");
  q.style.borderLeftColor = color;
  q.innerHTML = `<span class="qn">Claude: 🔧 ${esc(name)}</span><span class="qs"></span>`;
  q.querySelector(".qs").textContent = call ? summarizeInput(call.input) : "(call not seen: it was sent before the page was opened)";
  if (call) q.onclick = () => jumpTo(call.chat, call.node);
  bub.append(q);
  const r = resultText(b.content);
  const inp = (call && call.input) || {};
  if (isBash) {
    const m = r.text.match(/^Exit code (-?\d+)/m);
    const code = m ? Number(m[1]) : err ? null : 0;
    if (code != null) msg.querySelector(".sender").append(el("span", "exit " + (code === 0 ? "ok" : "bad"), "exit " + code));
  }
  if (err) bub.append(el("div", "errhead", "⚠️ Error"));
  if ((name === "Edit" || name === "MultiEdit") && inp.file_path) {
    const edits = name === "MultiEdit" ? (inp.edits || []) : [inp];
    for (const e of edits) bub.append(diffNode(inp.file_path, e.old_string, e.new_string));
  }
  if (name === "Read" && !err && inp.file_path && r.text) bub.append(docCard(inp.file_path, stripReminders(r.text), false));
  else if (r.text) bub.append(textNode(r.text));
  for (let i = 0; i < r.images; i++) bub.append(el("div", "imgph blk", "🖼 image"));
  for (const o of r.other) bub.append(jsonNode(o));
  if (!r.text && !r.images && !r.other.length) bub.append(el("div", "txt", (err ? "" : "↩ ") + "(no output)"));
  bub.append(el("div", "meta", clock(at)));
  msg.append(bub);
  addItem(chat, msg, { count: true, tools: [name], preview: (err ? "⚠️ " : "↩ ") + name + ": " + oneLine(r.text || "(no output)", 50) });
  if (err) addError(chat, msg);
  addSys(chat, `🔧 ${name} left the group`, [name]);
  chat.inGroup.delete(b.tool_use_id);
}

// ------------------------------------------------------------------ side requests
function renderSide(id, d, label) {
  const chat = sideChat();
  const box = el("div", "sidereq");
  const l1 = el("div", "sl");
  l1.append(el("b", null, "↪ " + (label || d.method + " " + String(d.path || "").split("?")[0])));
  if (d.model) l1.append(el("span", "tag model", d.model));
  l1.append(el("span", "sp"));
  const st = el("span", "muted", clock(d.started_at) + " | …");
  l1.append(st, infoButton(id));
  box.append(l1);
  const msgs = Array.isArray(d.messages) ? d.messages : [];
  let last = "";
  for (let i = msgs.length - 1; i >= 0 && !last; i--)
    if (msgs[i].role === "user") last = stripReminders(blocksOf(msgs[i]).filter(b => b && b.type === "text").map(b => b.text).join(" "));
  if (last) box.append(el("div", "q", "You: " + oneLine(last, 200)));
  const ans = el("div", "a", "…");
  box.append(ans);
  reqs.get(id).side = { box, st, ans };
  addItem(chat, box, { count: true, preview: oneLine(d.method + " " + (d.path || "") + (d.model ? " · " + d.model : ""), 60) });
}
function fillSide(rec, r) {
  const { box, st, ans } = rec.side;
  const chat = sideChat();
  const u = r.usage || {};
  const parts = [clock(), "HTTP " + r.status];
  if (u.input_tokens != null || u.output_tokens != null) parts.push("in " + fmtN(u.input_tokens), "out " + fmtN(u.output_tokens));
  parts.push(fmtMs(r.total_ms));
  if (r.cost != null) parts.push(fmtCost(r.cost));
  st.textContent = parts.join(" | ");
  addTotals(chat, r);
  if (r.status >= 400 || r.error) {
    box.classList.add("err");
    const e = r.error || {};
    ans.textContent = "⚠️ " + (e.message || JSON.stringify(e));
    addError(chat, box);
    return;
  }
  const text = (r.content || []).filter(b => b.type === "text").map(b => b.text).join(" ");
  const toolsUsed = (r.content || []).filter(b => b.type === "tool_use").map(b => "🔧 " + b.name).join(", ");
  ans.textContent = "↩ " + oneLine(text || toolsUsed || (r.other != null ? JSON.stringify(r.other) : "(no body)"), 300);
}

// ------------------------------------------------------------------ events
function checkSystemTools(chat, d) {
  const sk = JSON.stringify(stripCache(d.system ?? null));
  const tk = JSON.stringify(stripCache(d.tools ?? null));
  if (chat.sysKey !== null && sk !== chat.sysKey) { chat.sysChanged = true; addSys(chat, "⚙️ System prompt changed"); }
  if (chat.toolsKey !== null && tk !== chat.toolsKey) { chat.toolsChanged = true; addSys(chat, "⚙️ Tools changed"); }
  chat.sysKey = sk; chat.toolsKey = tk; chat.system = d.system; chat.tools = d.tools;
}
function onRequest(id, d) {
  const at = d.started_at || Date.now();
  if (isSide(d)) { reqs.set(id, { d, side: null, chat: sideChat() }); renderSide(id, d); return; }
  const msgs = Array.isArray(d.messages) ? d.messages : [];
  const keys = msgs.map(msgKey);
  const fk = keys[0] || "";
  let chat = chats.find(c => c.kind !== "side" && c.firstKey === fk);
  if (!chat) {
    // Section 7: a sub-agent chat starts with the prompt of an Agent/Task call already seen.
    const firstRaw = msgs[0] ? blocksOf(msgs[0]).filter(b => typeof b === "string" || (b && b.type === "text")).map(b => typeof b === "string" ? b : b.text).join("\n") : "";
    const first = stripReminders(firstRaw);
    const isSub = agentPrompts.has(firstRaw.trim()) || agentPrompts.has(first);
    const main = mainChat();
    if (!isSub && main.firstKey === null) chat = main;
    else { chat = newChat("sub", oneLine(first || "Sub-agent", 40)); chat.uncertain = !isSub; }
    chat.firstKey = fk;
    chat.firstText = firstRaw.trim();
    if (chat.uncertain && agentPrompts.has(first)) chat.uncertain = false;
  }
  const rec = { id, d, chat, keys, replyRendered: false, nodes: [], callIds: [], ticks: [], ttfb: null };
  chat.lastEvt = Date.now(); chat.lastFinal = false;
  reqs.set(id, rec);
  if (d.model) chat.model = d.model;
  checkSystemTools(chat, d);

  // The previous request of this chat = the one sharing the longest prefix.
  let best = null, bk = -1;
  for (let i = chat.history.length - 1; i >= 0; i--) {
    const r = chat.history[i];
    let k = 0;
    while (k < r.keys.length && k < keys.length && r.keys[k] === keys[k]) k++;
    if (k > bk) { bk = k; best = r; }
  }
  let start = 0;
  if (best) {
    start = bk;
    // Section 7: the latest request had the same history plus one extra user message
    // that this request does not carry -> that request was a fork; move it to Side requests.
    const isFork = best === chat.history[chat.history.length - 1] && bk > 0 && bk === best.keys.length - 1 &&
      best.d.messages[bk] && best.d.messages[bk].role === "user" &&
      blocksOf(best.d.messages[bk]).some(x => !(x && x.type === "tool_result"));
    if (isFork) moveFork(chat, best);
    else if (bk < best.keys.length) addSys(chat, "⚙️ History was rewritten");
  }
  rendering = rec;
  for (let i = start; i < msgs.length; i++) {
    const m = msgs[i];
    if (!m) continue;
    if (m.role === "assistant") {
      if (chat.replyKeys.has(keys[i])) continue;                       // already shown from its reply
      if (best && i === best.keys.length && best.replyRendered) continue;
      renderClaude(chat, blocksOf(m), id, null);
    } else renderUser(chat, m, id, at, i === msgs.length - 1 ? rec : null);
  }
  rendering = null;
  chat.history.push(rec);
  if (chat.history.length > 30) chat.history.shift();
  chat.pending++;
  if (chat === current) { updateHeader(); renderInfo(); }
  updateTyping();
}
function moveFork(chat, F) {
  for (const n of F.nodes) n.remove();
  chat.errors = chat.errors.filter(n => !F.nodes.includes(n));
  for (const id of F.callIds) chat.inGroup.delete(id);
  if (F.prevTurn) { chat.turnNo = F.prevTurn.no; chat.turn = F.prevTurn.turn; }
  chat.history = chat.history.filter(r => r !== F);
  F.fork = true;
  if (F.reply) subTotals(chat, F.reply); else chat.pending = Math.max(0, chat.pending - 1);
  renderSide(F.id, F.d, "fork of " + chat.name);
  if (F.reply) fillSide(F, F.reply);
  if (chat === current) { updateHeader(); renderInfo(); }
  updateTyping();
}
function subTotals(chat, r) {
  const u = r.usage || {}, t = chat.totals;
  t.in -= u.input_tokens || 0; t.out -= u.output_tokens || 0;
  t.cr -= u.cache_read_input_tokens || 0; t.cc -= u.cache_creation_input_tokens || 0;
  if (r.cost != null) t.cost -= r.cost;
  t.replies--;
}
function addTotals(chat, r) {
  const u = r.usage || {}, t = chat.totals;
  t.in += u.input_tokens || 0; t.out += u.output_tokens || 0;
  t.cr += u.cache_read_input_tokens || 0; t.cc += u.cache_creation_input_tokens || 0;
  if (r.cost != null) t.cost += r.cost; else if (u.input_tokens || u.output_tokens) t.costUnknown = true;
  t.replies++;
}
function onFirstByte(id, d) {
  const rec = reqs.get(id);
  if (!rec || !rec.ticks) return;
  rec.ttfb = d.ttfb_ms;
  updateTicks(rec);
}
function onReply(id, r) {
  const rec = reqs.get(id);
  if (!rec) return;               // request was sent before the page was opened (or before Clear)
  rec.reply = r;
  if (rec.ticks) updateTicks(rec);
  if (rec.side) { fillSide(rec, r); return; }
  if (rec.chat.kind === "side") return;
  const chat = rec.chat;
  chat.pending = Math.max(0, chat.pending - 1);
  chat.lastEvt = Date.now();
  addTotals(chat, r);
  const content = Array.isArray(r.content) ? r.content : [];
  const u = r.usage || {};
  if (r.context_window && (u.input_tokens != null)) chat.ctx = { used: (u.input_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0), of: r.context_window };
  else if (!r.context_window && u.input_tokens != null) chat.ctx = { used: null, of: null };
  rendering = rec;
  if (content.length || !(r.status >= 400 || r.error)) {
    renderClaude(chat, content, id, r);
    rec.replyRendered = true;
    chat.replyKeys.add(msgKey({ role: "assistant", content }));
  }
  if (r.status >= 400 || r.error) renderClaudeError(chat, r, id);
  rendering = null;
  chat.lastFinal = !(r.status >= 400 || r.error) && !content.some(b => b && (b.type === "tool_use" || b.type === "server_tool_use"));
  addToTurn(chat, rec, r, content);
  if (chat === current) { updateHeader(); renderInfo(); }
  updateTyping();
}

// ------------------------------------------------------------------ chat list
let listTimer = null;
function scheduleList() { if (!listTimer) listTimer = setTimeout(() => { listTimer = null; renderList(); }, 30); }
function renderList() {
  const rows = $("rows");
  rows.innerHTML = "";
  const order = [mainChat(), ...chats.filter(c => c.kind !== "main").sort((a, b) => b.lastAct - a.lastAct || a.id - b.id)];
  for (const c of order) {
    const r = el("div", "row" + (c === current ? " active" : "") + (c.unread ? " unread" : ""));
    const av = el("div", "avatar", c.kind === "main" ? "🤖" : c.kind === "sub" ? "🧩" : "↪");
    const mid = el("div", "mid");
    const top = el("div", "top");
    top.append(el("span", "name", c.name));
    top.append(el("span", "time", c.time));
    const bot = el("div", "bot");
    if (c.kind === "sub") bot.append(el("span", "tag sub", c.uncertain ? "🤖 Sub-agent (?)" : "🤖 Sub-agent"));
    bot.append(el("span", "prev", c.preview || (c.kind === "side" ? "Title, classification and token-count calls" : "")));
    if (c.errors.length) bot.append(el("span", "warn", "⚠️"));
    if (c.unread) bot.append(el("span", "badge", String(c.unread)));
    mid.append(top, bot);
    r.append(av, mid);
    r.onmousedown = e => { if (e.button === 0) openChat(c); };   // on press, so a re-sort cannot eat the click
    rows.append(r);
  }
}
function openChat(c) {
  if (current) { current.scrollTop = $("scroller").scrollTop; current.root.classList.add("hidden"); }
  current = c;
  c.root.classList.remove("hidden");
  c.unread = 0;
  if (c.scrollTop == null) scrollBottom(); else $("scroller").scrollTop = c.scrollTop;
  $("filter").value = c.filter;
  refreshFilter(c);
  updateHeader(); updateTyping(); updateNewBtn(); renderInfo(); renderList(); renderPin();
}

// ------------------------------------------------------------------ header, typing, new-messages
function updateHeader() {
  const c = current;
  $("cName").textContent = c.name;
  $("cAvatar").textContent = c.kind === "main" ? "🤖" : c.kind === "sub" ? "🧩" : "↪";
  $("cModel").textContent = c.model || "";
  $("cModel").style.display = c.model ? "" : "none";
  const tools = [...new Set(c.inGroup.values())];
  if (c.kind === "side") { $("cMembers").textContent = "click for info"; $("cStatus").textContent = "Small requests outside the conversation"; }
  else {
    $("cMembers").textContent = [c.kind === "sub" ? "Main agent" : "You", "Claude", ...tools].join(", ");
    const st = $("cStatus");
    st.className = "";
    if (c.pending > 0) { st.textContent = "Claude is typing..."; st.className = "typing"; }
    else if (tools.length) st.textContent = "waiting for " + tools.join(", ");
    else if (!c.lastEvt || Date.now() - c.lastEvt > 60000) st.textContent = "idle";
    else st.textContent = c.lastFinal ? "waiting for " + (c.kind === "sub" ? "Main agent" : "you") : "idle";
  }
  const cx = $("cCtx");
  cx.style.display = c.kind === "side" ? "none" : "";
  cx.className = "ctx";
  if (!c.ctx) { cx.textContent = "🔋 –"; cx.title = "Context window: no reply yet"; }
  else if (c.ctx.of == null) { cx.textContent = "🔋 ?"; cx.title = "Context window size unknown for this model"; }
  else {
    const pct = Math.round(100 * c.ctx.used / c.ctx.of);
    cx.textContent = "🔋 " + pct + "%";
    cx.title = `Context: ${fmtN(c.ctx.used)} of ${fmtN(c.ctx.of)} tokens (last reply)`;
    if (pct >= 90) cx.classList.add("crit"); else if (pct >= 70) cx.classList.add("warn");
  }
  const n = c.errors.length;
  $("errBtn").textContent = `⚠️ ${n} error${n === 1 ? "" : "s"}`;
  $("errBtn").classList.toggle("has", n > 0);
}
function updateTyping() {
  const t = $("typing");
  t.innerHTML = "";
  if (!current || current.kind === "side") return;
  if (current.pending > 0) t.append(el("span", null, "Claude is typing"));
  for (const name of new Set(current.inGroup.values())) {
    const s = el("span", null, name + " is typing");
    s.style.color = toolColor(name);
    t.append(s);
  }
}
function updateNewBtn() {
  const b = $("newBtn");
  if (!current || current.newCount <= 0) { b.style.display = "none"; return; }
  b.textContent = `↓ ${current.newCount} new message${current.newCount === 1 ? "" : "s"}`;
  b.style.display = "block";
}
$("newBtn").onclick = () => { scrollBottom(); current.newCount = 0; updateNewBtn(); };
$("scroller").addEventListener("scroll", () => {
  if (current && current.newCount && atBottom()) { current.newCount = 0; updateNewBtn(); }
});
$("errBtn").onclick = () => {
  const c = current;
  if (!c.errors.length) return;
  const node = c.errors[c.errIdx % c.errors.length];
  c.errIdx++;
  if (c.filter) { c.filter = ""; $("filter").value = ""; applyFilter(c); }
  jumpTo(c, node);
};
function jumpTo(chat, node) {
  if (chat !== current) openChat(chat);
  node.scrollIntoView({ block: "center", behavior: "smooth" });
  flash(node.querySelector(".bubble") || node);
}

// ------------------------------------------------------------------ pinned plan (section 12)
function renderPin() {
  const p = $("pin"), c = current;
  const todos = c && c.kind !== "side" && c.plan;
  p.classList.toggle("on", !!todos);
  p.innerHTML = "";
  if (!todos) return;
  const done = todos.filter(t => t.status === "completed").length;
  const now = todos.find(t => t.status === "in_progress");
  const l = el("div", "pl");
  l.append(el("b", null, `📌 Plan · ${done}/${todos.length} done`));
  l.append(el("span", "sp", now ? "⏳ " + (now.activeForm || now.content || "") : ""));
  l.append(el("span", "muted", c.planOpen ? "▴" : "▾"));
  p.append(l);
  if (c.planOpen) {
    const ul = el("ul");
    for (const t of todos) ul.append(el("li", t.status === "completed" ? "done" : t.status === "in_progress" ? "now" : "", todoIcon(t.status) + " " + (t.content || "")));
    p.append(ul);
  }
}
$("pin").onclick = () => { if (current) { current.planOpen = !current.planOpen; renderPin(); } };

// ------------------------------------------------------------------ tool filter
function refreshFilter(c) {
  if (c !== current) return;
  const sel = $("filter");
  const want = ["", ...[...c.toolsSeen].sort()];
  const have = [...sel.options].map(o => o.value);
  if (want.join("\n") !== have.join("\n")) {
    sel.innerHTML = "";
    for (const v of want) { const o = el("option", null, v ? "Only " + v : "All"); o.value = v; sel.append(o); }
    sel.value = c.filter;
  }
  sel.style.display = c.kind === "side" ? "none" : "";
}
// Hidden when the filter does not match; your messages stay, dimmed (section 8).
function filterOne(c, n) {
  if (!n.dataset.tools) return;
  const miss = !!c.filter && n.dataset.tools !== " * " && !n.dataset.tools.includes(" " + c.filter + " ");
  if (n.dataset.user) { n.classList.toggle("dim", miss); n.classList.remove("hidden"); }
  else n.classList.toggle("hidden", miss || !!n.dataset.wait);
}
function applyFilter(c) { for (const n of c.root.children) filterOne(c, n); }
$("filter").onchange = e => { current.filter = e.target.value; applyFilter(current); scrollBottom(); };

// ------------------------------------------------------------------ group info panel
function renderInfo() {
  if (!$("app").classList.contains("info-open") || !current) return;
  const c = current, body = $("infoBody");
  const openState = {};
  body.querySelectorAll("details[data-k]").forEach(d => openState[d.dataset.k] = d.open);
  body.innerHTML = "";
  const sec = title => { const s = el("div", "isec"); const h = el("h3"); h.innerHTML = title; s.append(h); body.append(s); return s; };
  const det = (k, summary, build) => {
    const d = el("details", "dd"); d.dataset.k = k;
    d.append(el("summary", null, summary));
    let built = false;
    d.addEventListener("toggle", () => { if (d.open && !built) { built = true; d.append(build()); } });
    if (openState[k]) d.open = true;
    return d;
  };
  const head = sec(esc(c.name));
  head.append(el("div", "muted", c.kind === "main" ? "Main conversation" : c.kind === "sub" ? "🤖 Sub-agent" : "Side requests"));
  if (c.model) head.append(el("div", null, "Model: " + c.model));

  if (c.kind !== "side") {
    const sp = sec("System Prompt" + (c.sysChanged ? '<span class="changed">changed</span>' : ""));
    const st = systemText(c.system);
    if (!st) sp.append(el("div", "muted", "(none yet)"));
    else sp.append(det("sys", `${lines(st)} lines · click to expand`, () => el("pre", null, st)));

    const tools = Array.isArray(c.tools) ? c.tools : [];
    const ts = sec("Tools Available: " + tools.length + (c.toolsChanged ? '<span class="changed">changed</span>' : ""));
    ts.append(el("div", null, tools.map(t => t.name || t.type).join(", ") || "(none)"));
    if (tools.length) ts.append(det("tools", "Show full schemas", () => {
      const w = el("div");
      for (const t of tools) { const d = el("details", "dd"); d.append(el("summary", null, t.name || t.type)); d.append(jsonNode(t)); w.append(d); }
      return w;
    }));
  }
  const t = c.totals;
  const tot = sec("Totals for this chat");
  const kv = el("div", "kv");
  const add = (k, v) => kv.append(el("span", null, k), el("span", null, v));
  add("Replies", String(t.replies));
  add("Input tokens", fmtN(t.in)); add("Cache read", fmtN(t.cr)); add("Cache write", fmtN(t.cc)); add("Output tokens", fmtN(t.out));
  add("Cost", t.replies ? (t.costUnknown ? fmtCost(t.cost) + " + n/a" : fmtCost(t.cost)) : "–");
  add("Errors", String(c.errors.length));
  tot.append(kv);
  if (c.kind !== "side") {
    const tu = sec("Tool calls");
    const names = Object.keys(c.toolCounts).sort((a, b) => c.toolCounts[b] - c.toolCounts[a]);
    if (!names.length) tu.append(el("div", "muted", "No tool calls yet"));
    const kv2 = el("div", "kv");
    for (const n of names) { const s = el("span", null, n); s.style.color = toolColor(n); s.style.fontWeight = "600"; kv2.append(s, el("span", null, "× " + c.toolCounts[n])); }
    tu.append(kv2);
  }
}
function toggleInfo(open) {
  $("app").classList.toggle("info-open", open);
  if (open && current) { current.sysChanged = current.sysChanged; renderInfo(); }
}
$("cWho").onclick = () => toggleInfo(!$("app").classList.contains("info-open"));
$("infoClose").onclick = () => toggleInfo(false);

// ------------------------------------------------------------------ request details modal
function showRequest(id) {
  const rec = reqs.get(id);
  if (!rec) return;
  const d = rec.d, box = $("modalBox");
  box.innerHTML = "";
  const h = el("h2");
  h.append(el("span", null, d.method + " " + d.path));
  if (d.model) h.append(el("span", "tag model", d.model));
  h.append(el("span", "sp"));
  const x = el("button", null, "✕"); x.onclick = closeModal; h.append(x);
  box.append(h);
  const sect = (title, obj, open) => {
    const det = el("details"); det.open = !!open;
    det.append(el("summary", null, title));
    det.append(jsonNode(obj));
    box.append(det);
  };
  sect("Parameters", d.params || {}, true);
  sect("HTTP headers (secrets cut)", d.headers || {});
  if (d.system) sect("System prompt (" + lines(systemText(d.system)) + " lines)", d.system);
  if (d.tools) sect("Tools (" + d.tools.length + ")", d.tools);
  if (d.messages) sect("Messages (" + d.messages.length + ")", d.messages);
  if (d.raw_body) sect("Raw body", d.raw_body);
  if (rec.reply) sect("Reply (reassembled)", rec.reply);
  $("modal").classList.add("open");
}
function closeModal() { $("modal").classList.remove("open"); }
$("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

// ------------------------------------------------------------------ clear + SSE
$("clearBtn").onclick = () => { reset(); toggleInfo($("app").classList.contains("info-open")); };
function connect() {
  const es = new EventSource("/dashboard/events");
  es.onopen = () => $("conn").classList.add("on");
  es.onerror = () => $("conn").classList.remove("on");
  es.onmessage = e => {
    let ev;
    try { ev = JSON.parse(e.data); } catch (_) { return; }
    try {
      if (ev.type === "request") onRequest(ev.id, ev.data || {});
      else if (ev.type === "reply") onReply(ev.id, ev.data || {});
      else if (ev.type === "first_byte") onFirstByte(ev.id, ev.data || {});
    } catch (err) { console.error("dashboard: could not render event", ev, err); }
  };
}
reset();
connect();
setInterval(() => { if (current) updateHeader(); }, 5000);   // status line turns "idle" after 60 s
</script>
